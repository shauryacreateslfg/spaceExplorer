<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ISS Tracker</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <nav>
        <a href="index.html">APOD</a>
        <a href="iss.html">ISS Tracker</a>
    </nav>

    <main>
        <h1>ISS Live Tracker</h1>

        <div id="coords-box">
            <div class="coord">
                <span class="label">Latitude</span>
                <span id="lat">--</span>
            </div>

            <div class="coord">
                <span class="label">Longitude</span>
                <span id="lon">--</span>
            </div>

            <div class="coord">
                <span class="label">Altitude</span>
                <span id="alt">--</span>
            </div>

            <div class="coord">
                <span class="label">Speed</span>
                <span id="speed">--</span>
            </div>
        </div>


        

    </main>
</body>
</html>
