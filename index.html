<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Space Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">APOD</a>
        <a href="iss.html">ISS Tracker</a>
    </nav>

    <main>
        <h1>Astronomy Pictre of the Day</h1>

        <div id="countdown">Next picture in:<span i="timer">--:--:--</span></div>

        <div id="picture-box">
            <img id="apod-img" src="" alt="">
            <video id="apod-video" src="" controls hidden></video>
        </div>

        <h2 id="apod-title">Loading...</h2>
        <p id="apod-date"></p>
        <p id="apod-desc"></p>

        <button id="random-btn">Random APOD</button>
    </main>

    <script src="apod.js"></script>

</body>
</html>
